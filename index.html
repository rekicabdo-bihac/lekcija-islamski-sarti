<!doctype html><html lang='bs'><head><script async src="https://www.googletagmanager.com/gtag/js?id=G-4WRS80K94M"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","G-4WRS80K94M");</script><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Islamski šarti – interaktivna lekcija</title><style>
:root{--g:#177245;--g2:#0d4f31;--gold:#d8a32d;--cream:#fff8e8;--red:#e85d4a;--ink:#173127}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(#f7e6d5,#fff8e8);color:var(--ink)}.app{max-width:900px;margin:auto;min-height:100vh;padding:12px}.hero{background:linear-gradient(135deg,#ef7865,#f6b35f);border-radius:22px;padding:18px;text-align:center;color:#fff;box-shadow:0 10px 30px #0002}.hero h1{margin:0;font-size:clamp(32px,7vw,58px);text-shadow:0 3px 0 #0002}.hero p{margin:8px auto 0;max-width:720px;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tabs button,.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;background:#fff;box-shadow:0 4px 12px #0002;color:var(--g2);white-space:nowrap}.tabs button.active,.btn.primary{background:var(--g);color:#fff}.card{background:#fffdf8;border:3px solid #e9d9b9;border-radius:22px;padding:18px;box-shadow:0 8px 24px #0001}.lead{font-size:18px;line-height:1.5}.pillars{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}.pillar{border:2px solid #88b99d;background:#f4fff7;border-radius:18px;padding:12px 8px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}.pillar .ico{font-size:42px}.pillar b{font-size:16px}.pillar small{display:block;margin-top:5px}.note{margin-top:14px;background:#eef9f1;border-left:6px solid var(--g);padding:13px;border-radius:12px}.q{font-size:clamp(20px,4vw,30px);font-weight:900;margin:6px 0 16px}.answers{display:grid;gap:10px}.answer{border:2px solid #d7d7d7;background:#fff;border-radius:14px;padding:14px;text-align:left;font-weight:750;font-size:17px}.answer.ok{background:#dff5e6;border-color:#2e9b55}.answer.bad{background:#ffe0dd;border-color:#d95649}.status{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px;font-weight:800}.order{display:grid;gap:9px}.order button{font-size:18px}.missing{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}.slot{min-width:90px;padding:16px 10px;border-radius:14px;background:#edf7ef;border:2px solid #8abb96;text-align:center;font-weight:900}.slot.blank{background:#fff5c9;border-style:dashed}.footer{text-align:center;padding:16px;font-weight:800;color:#466}.hide{display:none}@media(max-width:700px){.pillars{grid-template-columns:1fr 1fr}.pillar:last-child{grid-column:1/-1}.app{padding:8px}.card{padding:14px}.hero{padding:14px}.tabs button{padding:10px 12px}}
</style></head><body><main class='app'><section class='hero'><h1>ISLAMSKI ŠARTI</h1><p>Glavne islamske dužnosti koje je obavezan izvršavati svaki punoljetan musliman i muslimanka.</p></section><nav class='tabs' id='tabs'></nav><section class='card' id='stage'></section><div class='footer'>Pripremio Abdo ef. Rekić</div></main><script>
const pillars=[['☝️','1. Kelimei-šehadet','Svjedočiti da nema drugog boga osim Allaha i da je Muhammed, a.s., Allahov poslanik.'],['🕌','2. Namaz','Klanjati pet dnevnih namaza.'],['🌙','3. Post','Postiti mjesec ramazan.'],['🤲','4. Zekat','Davati zekat isključivo u Bejtul-mal.'],['🕋','5. Hadž','Obaviti hadž ko je u mogućnosti.']];
const stages=['NAUČI','SPOJI','SLOŽI REDOM','ŠTA NEDOSTAJE?','PREPOZNAJ PO ZNAČENJU','BRZI IZAZOV','ZAVRŠNI ISPIT'];let si=0,score=0,qi=0,locked=false;
const qs=[
['Koliko ima glavnih islamskih dužnosti – islamskih šarta?',['Pet','Šest','Četiri','Sedam'],0],['Koji je prvi islamski šart?',['Namaz','Kelimei-šehadet','Post','Hadž'],1],['Koji islamski šart se izvršava pet puta dnevno?',['Zekat','Hadž','Namaz','Post'],2],['Koji šart je vezan za mjesec ramazan?',['Post','Hadž','Zekat','Namaz'],0],['Koji šart podrazumijeva odlazak u Mekku za onoga ko je u mogućnosti?',['Namaz','Hadž','Post','Zekat'],1],['Šta su islamski šarti?',['Glavne islamske dužnosti','Samo dobrovoljna djela','Imena sura','Dijelovi abdesta'],0],['Ko je naredio glavne islamske dužnosti?',['Ljudi','Allah, dž.š.','Učitelji','Putnici'],1],['Čime iskazujemo poslušnost Allahu, dž.š.?',['Izvršavanjem islamskih dužnosti','Samo riječima','Igricom','Putovanjem'],0],['Koji je četvrti islamski šart?',['Post','Namaz','Zekat','Hadž'],2],['Koji je peti islamski šart?',['Hadž','Post','Namaz','Kelimei-šehadet'],0]
];
function beep(ok){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?700:220;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function tabs(){document.querySelector('#tabs').innerHTML=stages.map((x,i)=>`<button class='${i==si?'active':''}' onclick='go(${i})'>${i+1}. ${x}</button>`).join('')}
function go(i){si=i;qi=0;locked=false;tabs();render()}
function render(){let s=document.querySelector('#stage'); if(si===0){s.innerHTML=`<div class='lead'><b>ISLAMSKI ŠARTI</b> su glavne islamske dužnosti. Uzvišeni Allah ih je naredio, a njihovim izvršavanjem iskazujemo poslušnost Allahu i očekujemo Njegovu nagradu.</div><div class='pillars'>${pillars.map(p=>`<div class='pillar' onclick='this.querySelector("small").classList.toggle("hide")'><div class='ico'>${p[0]}</div><b>${p[1]}</b><small>${p[2]}</small></div>`).join('')}</div><div class='note'><b>Zapamti:</b> 1. Kelimei-šehadet → 2. Namaz → 3. Post → 4. Zekat → 5. Hadž.</div><button class='btn primary' style='margin-top:15px' onclick='go(1)'>Nastavi →</button>`}
else if(si===1){quizLike('SPOJI','Spoji pojam sa tačnim značenjem.',[['Namaz','Klanjati pet dnevnih namaza'],['Post','Postiti ramazan'],['Hadž','Obaviti hadž ko je u mogućnosti'],['Zekat','Davati zekat isključivo u Bejtul-mal']],2)}
else if(si===2){s.innerHTML=`<div class='q'>SLOŽI REDOM</div><p>Pritisni islamske šarte pravilnim redom od 1 do 5.</p><div class='order' id='order'>${shuffle(pillars.map((p,i)=>[p[1].replace(/^\d+\.\s*/,''),i])).map(x=>`<button class='btn' onclick='pickOrder(this,${x[1]})'>${x[0]}</button>`).join('')}</div><div id='msg' class='note'>Počni od prvog islamskog šarta.</div>`}
else if(si===3){let miss=Math.floor(Math.random()*5);s.dataset.miss=miss;s.innerHTML=`<div class='q'>ŠTA NEDOSTAJE?</div><div class='missing'>${pillars.map((p,i)=>`<div class='slot ${i==miss?'blank':''}'>${i==miss?'❓':p[1]}</div>`).join('')}</div><div class='answers'>${shuffle(pillars.map((p,i)=>[p[1],i])).map(x=>`<button class='answer' onclick='missing(this,${x[1]})'>${x[0]}</button>`).join('')}</div>`}
else if(si===4){question(4)} else if(si===5){question(5)} else {question(6)}}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function quizLike(title,desc,pairs,next){let s=document.querySelector('#stage'), p=pairs[qi%pairs.length];s.innerHTML=`<div class='q'>${title}</div><p>${desc}</p><h3>${p[0]}</h3><div class='answers'>${shuffle(pairs.map(x=>x[1])).map(a=>`<button class='answer' onclick='pair(this,${JSON.stringify(a)},${JSON.stringify(p[1])},${next})'>${a}</button>`).join('')}</div><div class='status'><span>Tačno: ${score}</span><span>${qi+1}/${pairs.length}</span></div>`}
function pair(b,a,c,next){if(locked)return;locked=true;let ok=a===c;b.classList.add(ok?'ok':'bad');beep(ok);if(ok)score+=10;else score-=3;setTimeout(()=>{locked=false;qi++;if(qi>=4)go(next);else render()},700)}
let ord=0;function pickOrder(b,i){if(i===ord){b.classList.add('ok');b.disabled=true;beep(true);ord++;document.querySelector('#msg').textContent=ord===5?'Bravo! Redoslijed je tačan.':'Odlično! Nastavi.';if(ord===5)setTimeout(()=>{ord=0;go(3)},900)}else{b.classList.add('bad');beep(false);setTimeout(()=>b.classList.remove('bad'),500)}}
function missing(b,i){if(locked)return;locked=true;let ok=i==+document.querySelector('#stage').dataset.miss;b.classList.add(ok?'ok':'bad');beep(ok);setTimeout(()=>go(4),800)}
function question(mode){let s=document.querySelector('#stage');let pool=mode===4?[1,2,3,4,8,9]:qs.map((_,i)=>i);let total=mode===6?30:mode===5?10:6;if(qi>=total){s.innerHTML=`<div class='q'>🎉 Završeno!</div><p class='lead'>Osvojio/la si <b>${score}</b> bodova.</p><button class='btn primary' onclick='score=0;go(${mode===4?5:mode===5?6:0})'>${mode===6?'Ponovi lekciju':'Nastavi →'}</button>`;return}let q=qs[pool[qi%pool.length]];let opts=q[1].map((x,i)=>[x,i]);s.innerHTML=`<div class='q'>${mode===4?'PREPOZNAJ PO ZNAČENJU':mode===5?'BRZI IZAZOV':'ZAVRŠNI ISPIT – 30 ZADATAKA'}</div><h2>${q[0]}</h2><div class='answers'>${shuffle(opts).map(x=>`<button class='answer' onclick='ans(this,${x[1]},${q[2]},${mode})'>${x[0]}</button>`).join('')}</div><div class='status'><span>Bodovi: ${score}</span><span>Zadatak ${qi+1}/${total}</span></div>`}
function ans(b,i,c,m){if(locked)return;locked=true;let ok=i===c;b.classList.add(ok?'ok':'bad');score+=ok?10:-3;beep(ok);setTimeout(()=>{qi++;locked=false;render()},550)}
tabs();render();</script></body></html>
